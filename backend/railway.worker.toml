# Railway configuration for the Celery worker only.
# Configure the worker service's config file path as /backend/railway.worker.toml.
# The worker has no HTTP listener, so it intentionally has no healthcheckPath.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
